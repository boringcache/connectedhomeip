name: BoringCache validation
run-name: ${{ inputs.connect && 'connectedhomeip OIDC connection' || format('connectedhomeip cold and warm at {0}', github.sha) }}

on:
  workflow_dispatch:
    inputs:
      connect:
        description: Connect this validation branch through GitHub OIDC
        required: false
        default: false
        type: boolean
      series:
        description: Cache series shared by cold, warm, and rolling jobs
        required: false
        default: matter-linux-ccache-20260923-a
        type: string

permissions:
  actions: write
  contents: read
  id-token: write

concurrency:
  group: connectedhomeip-boringcache-validation
  cancel-in-progress: false

jobs:
  connect:
    name: Connect GitHub OIDC
    if: inputs.connect && github.repository == 'boringcache/connectedhomeip' && github.ref == 'refs/heads/boringcache-validation'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install the released BoringCache CLI
        run: |
          curl -fsSL https://install.boringcache.com/install.sh -o "$RUNNER_TEMP/install-boringcache.sh"
          sh "$RUNNER_TEMP/install-boringcache.sh"
          printf '%s/.local/bin\n' "$HOME" >> "$GITHUB_PATH"
      - name: Start the browser approval request
        run: |
          set -euo pipefail
          approval_log="$RUNNER_TEMP/boringcache-connect.log"
          nohup boringcache ci connect --oidc-provider github-actions > "$approval_log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/boringcache-connect.pid"
          for _ in $(seq 1 60); do
            if grep -q 'Direct link:' "$approval_log"; then
              exit 0
            fi
            sleep 1
          done
          echo "The approval link was not produced within 60 seconds."
          exit 1
      - name: Retain the short-lived approval request
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: boringcache-oidc-approval-${{ github.run_id }}
          path: ${{ runner.temp }}/boringcache-connect.log
          if-no-files-found: error
          retention-days: 1
      - name: Wait for browser approval
        run: |
          set -euo pipefail
          pid=$(cat "$RUNNER_TEMP/boringcache-connect.pid")
          while kill -0 "$pid" 2>/dev/null; do
            sleep 5
          done
          cat "$RUNNER_TEMP/boringcache-connect.log"
          grep -q 'Machine connection ready' "$RUNNER_TEMP/boringcache-connect.log"

  cold:
    name: ${{ matrix.provider }} cold
    if: ${{ !inputs.connect && github.repository == 'boringcache/connectedhomeip' && github.ref == 'refs/heads/boringcache-validation' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: ghcr.io/project-chip/chip-build:211
      options: >-
        --privileged --sysctl "net.ipv6.conf.all.disable_ipv6=0
        net.ipv4.conf.all.forwarding=1 net.ipv6.conf.all.forwarding=1"
    strategy:
      fail-fast: false
      matrix:
        provider: [GitHub, BoringCache]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/boringcache-validation
        with:
          provider: ${{ matrix.provider }}
          phase: cold
          series: ${{ inputs.series }}

  warm:
    name: ${{ matrix.provider }} warm
    if: ${{ !inputs.connect && github.repository == 'boringcache/connectedhomeip' && github.ref == 'refs/heads/boringcache-validation' }}
    needs: cold
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: ghcr.io/project-chip/chip-build:211
      options: >-
        --privileged --sysctl "net.ipv6.conf.all.disable_ipv6=0
        net.ipv4.conf.all.forwarding=1 net.ipv6.conf.all.forwarding=1"
    strategy:
      fail-fast: false
      matrix:
        provider: [GitHub, BoringCache]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/boringcache-validation
        with:
          provider: ${{ matrix.provider }}
          phase: warm
          series: ${{ inputs.series }}
